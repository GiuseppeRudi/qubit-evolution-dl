data:
  dataset:
    csv_path: data/trajectories.csv
    total_qubits: 10
    used_qubits: 10
    time_steps: 1001
    n_traj: 400
    traj_fraction: 1
  windowing:
    input_seq_len: 200
    output_seq_len: 50
    stride: 20
  split:
    seed: 42
    val_ratio: 0.2
    test_ratio: 0.15
model:
  name: lstm_fullseq_30ep
  save_model: true
  type: LSTM
  variant: FC
  decoder_mode: FULL_SEQ
  params:
    latent_dim: 192
    dropout: 0.2
  compile:
    optimizer: adam
    loss: mse
    metrics:
    - mae
    - mse
    run_eagerly: false
    learning_rate: 0.0009716208895380814
    clip_norm: 0.6470376604234769
  inference:
    mode: free_running
    start_mode: last_x
    verbose: 0
training:
  prediction_mode: all
  verbose: 1
  batch_size: 32
  curriculum:
  - 0.1
  - 0.1
  - 0.25
  - 0.25
  - 0.35
  - 0.35
  - 0.5
  - 0.5
  - 0.75
  - 0.75
  - 1
  - 1
  phases:
  - name: teacher_forcing
    epochs: 2
    learning_rate: 1.0
    clip_norm: 1.0
  - name: masked_modeling
    epochs: 3
    mask_prob: 0.1
    mask_scope: time
    mask_mode: constant
    mask_value: 0.2
    noise_replace: false
    learning_rate: 0.8
    clip_norm: 0.9
  - name: teacher_forcing
    epochs: 2
    learning_rate: 1.0
    clip_norm: 1.0
  - name: masked_modeling
    epochs: 3
    mask_prob: 0.15
    mask_scope: time
    mask_mode: constant
    mask_value: 0.2
    noise_replace: false
    learning_rate: 0.7
    clip_norm: 0.85
  - name: teacher_forcing
    epochs: 2
    learning_rate: 1
    clip_norm: 1.0
  - name: masked_modeling
    epochs: 3
    mask_prob: 0.2
    mask_scope: time
    mask_mode: constant
    mask_value: 0.2
    noise_replace: false
    learning_rate: 0.6
    clip_norm: 0.8
  - name: teacher_forcing
    epochs: 2
    learning_rate: 1
    clip_norm: 1.0
  - name: masked_modeling
    epochs: 3
    mask_prob: 0.2
    mask_scope: time
    mask_mode: noise
    noise_sigma: 0.1
    noise_replace: false
    learning_rate: 0.5
    clip_norm: 0.75
  - name: teacher_forcing
    epochs: 2
    learning_rate: 1
    clip_norm: 1.0
  - name: masked_modeling
    epochs: 3
    mask_prob: 0.25
    mask_scope: time
    mask_mode: noise
    noise_sigma: 0.1
    noise_replace: false
    learning_rate: 0.4
    clip_norm: 0.7
  - name: teacher_forcing
    epochs: 2
    learning_rate: 1
    clip_norm: 1.0
  - name: masked_modeling
    epochs: 3
    mask_prob: 0.25
    mask_scope: time
    mask_mode: noise
    noise_sigma: 0.1
    noise_replace: true
    learning_rate: 0.36
    clip_norm: 0.65
  fr_eval:
    enabled: true
    split: val
    batch_size: 32
    probes:
    - name: fr_phase
      out_steps: phase
      every_epochs: 2
      p_eval: 0.8
    - name: fr_target
      out_steps: global
      every_epochs: end_of_phase
      p_eval: 0.3
    - name: fr_curve
      out_steps:
      - 0.2
      - 0.4
      - 0.6
      - 1
      every_epochs: end_of_phase
      p_eval: 0.2
plot:
  sample_index:
  - 0
  - 2
  - 4
  save_plots: true
  save_artifacts: true
