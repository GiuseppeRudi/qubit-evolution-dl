data:
  dataset:
    csv_path: data/trajectories.csv
    total_qubits: 10 # fixed  
    used_qubits: 8
    time_steps: 1001 # fixed 
    n_traj: 400 # fixed 
    traj_fraction: 0.025

  windowing:
    input_seq_len: 400
    output_seq_len: 50
    stride: 20

  split:
    seed: 42
    val_ratio: 0.2
    test_ratio: 0.15

model:
  name: "prova1"
  save_model: true
  type: "LSTM"
  variant: "FC"
  decoder_mode: "FULL_SEQ"  

  params:
    latent_dim: 128
    dropout: 0.1

  compile:
    optimizer: "adam"
    loss: "mse"
    metrics: ["mae"]
    run_eagerly: false
    learning_rate: 1e-3
    clip_norm: 1.0

  inference:
    mode: "free_running" 
    start_mode: "zeros"   
    verbose: 0  

training:
  prediction_mode: "all" 
  verbose: 1
  batch_size: 64
  curriculum: [0.3,1]
  phases:
    - name: masked_modeling
      epochs: 5
      mask_prob: 0.20
      learning_rate: 0.5
      clip_norm: 0.7
      mask_scope: time        # time | element | feature
      mask_mode: constant         # zero | constant | noise
      mask_value: 0.2         # solo se constant
      noise_sigma: 0.1        # solo se noise
      noise_replace: false # true: mask replacing the original value with noise
                           # false: mask adding noise to the original value
    
    - name: teacher_forcing
      epochs: 5

# SCHEDULED SAMPLING and FULL AUTOREGRESSIVE in fullseq cannot be done

  # free-running evaluation
  fr_eval:
    enabled: true
    split: val   # val || test 
    batch_size: 32
    
    # p_eval => percentuage of the (val or test) split
    # out_steps can be 
    # out_steps => phase  where phase take horizon prediction determinated by a used strategy
    # out_steps => global where the horizon prediction are taken by output_seq_len
    # out_steps => [10,25,60,100] a list of horizon values insert by the programmer 
    probes:
      - name: fr_phase 
        out_steps: phase  
        every_epochs: 2
        p_eval: 0.8    

      - name: fr_target
        out_steps: global
        p_eval: 0.3
        every_epochs: end_of_phase

      - name: fr_curve
        out_steps: [0.02,0.04,0.1] 
        p_eval: 0.2
        every_epochs: end_of_phase

plot:
  sample_index: [0,2,4]  # None = 0 , oppure una cosi = 1 oppure lista cosi []
  save_plots: true
  save_artifacts: true