run:
  name: "Lstm_prova"

data:
  dataset:
    csv_path: data/trajectories.csv
    total_qubits: 10
    used_qubits: 8
    time_steps: 1001
    n_traj: 400
    traj_fraction: 1

  windowing:
    input_seq_len: 100
    output_seq_len: 100
    stride: 20
    mode: seq2seq      

  split:
    seed: 42
    val_ratio: 0.1
    test_ratio: 0.1

model:
  name: "lstm_baseline_v1"
  save_model: true
  type: "RNN"
  variant: "SEQ2SEQ"

  params:
    latent_dim: 128

  compile:
    optimizer: "adam"
    loss: "mse"
    metrics: ["mae"]

  training:
    epochs: 30
    batch_size: 32

training:
  strategy: "standard"   # standard | teacher_forcing | autoregressive (future)

  
evaluation:
  pred_all : true
  sample_index: [0, 2, 20]
  print_steps: 5
  save_plots: true
  predictions_dir: "predictions"
