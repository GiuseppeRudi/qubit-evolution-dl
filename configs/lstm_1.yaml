run:
  name: "Lstm_prova"

data:
  dataset:
    csv_path: data/trajectories.csv
    total_qubits: 10
    used_qubits: 2
    time_steps: 1001
    n_traj: 400
    traj_fraction: 1

  windowing:
    input_seq_len: 200
    output_seq_len: 100
    stride: 1         
    mode: seq2seq      

  split:
    seed: 42
    val_ratio: 0.1
    test_ratio: 0.1

model:
  name: "lstm_baseline_v1"
  type: "RNN"
  variant: "SEQ2SEQ"

  params:
    latent_dim: 32

  compile:
    optimizer: "adam"
    loss: "mse"
    metrics: ["mae"]

  training:
    epochs: 100
    batch_size: 16

training:
  strategy: "standard"   # standard | teacher_forcing | autoregressive (future)

evaluation:
  sample_index: 0
  print_steps: 5
  save_plots: true
  predictions_dir: "predictions"
