data:
  dataset:
    csv_path: data/trajectories.csv
    total_qubits: 10 # fixed 
    used_qubits: 8
    time_steps: 1001 # fixed 
    n_traj: 400 # fixed 
    traj_fraction: 0.1

  windowing:
    input_seq_len: 200
    output_seq_len: 50
    stride: 20

  split:
    seed: 42
    val_ratio: 0.2
    test_ratio: 0.15

model:
  name: "prova1"
  save_model: true
  type: "LSTM"
  variant: "FC"
  decoder_mode: "HYBRID"  

  params:
    latent_dim: 128
    dropout: 0.1

  compile:
    optimizer: "adam"
    loss: "mse"
    metrics: ["mae"]
    run_eagerly: false
    learning_rate: 5e-4
    clip_norm: 1.0

  inference:
    mode: "free_running"   
    start_mode: "last_x"  
    verbose: 0  

training:
  prediction_mode: "all" 
  verbose: 1
  batch_size: 64
  curriculum: [0.3]
  phases:

    - name: teacher_forcing
      epochs: 6
      learning_rate: 1.00
      clip_norm: 1.00


  fr_eval:
    enabled: true
    split: val   
    batch_size: 32
    
    probes:
      - name: fr_phase 
        out_steps: phase  
        every_epochs: 2
        p_eval: 0.8    

      - name: fr_target
        out_steps: global
        p_eval: 0.3
        every_epochs: end_of_phase

      - name: fr_curve
        out_steps: [0.02,0.04,0.06] 
        p_eval: 0.2
        every_epochs: end_of_phase

plot:
  sample_index: [0,2,4] 
  save_plots: true
  save_artifacts: true