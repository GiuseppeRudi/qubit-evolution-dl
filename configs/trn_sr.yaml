data:
  dataset:
    csv_path: data/trajectories.csv
    total_qubits: 10
    used_qubits: 8
    time_steps: 1001
    n_traj: 400
    traj_fraction: 1

  windowing:
    input_seq_len: 200
    output_seq_len: 400
    stride: 2

  split:
    seed: 42
    val_ratio: 0.2
    test_ratio: 0.15

sr:
  stride: 2
  offset: 0
  mask_value: 0.0
  loss_on: all              
  observed_weight: 0.05     

model:
  name: "sr1_opt"
  save_model: true
  type: "TRN"
  variant: "SR"
  decoder_mode: "ENCODER_ONLY"

  params:
    dim_model: 128         
    num_heads: 4
    ff_dim: 1024             
    num_layers: 3
    dropout: 0.1

  compile:
    optimizer: "adam"
    loss: "mse"
    metrics: ["mae"]
    run_eagerly: false
    learning_rate: 5e-4    
    clip_norm: 1.0

training:
  verbose: 1
  epochs: 30               
  batch_size: 64

plot:
  sample_index: [0, 2, 4]
  save_plots: true
  save_artifacts: true
