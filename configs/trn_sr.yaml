data:
  dataset:
    csv_path: data/trajectories.csv
    total_qubits: 10 # fixed values 
    used_qubits: 8
    time_steps: 1001 # fixed 
    n_traj: 400 # fixed 
    traj_fraction: 0.025

  windowing:
    input_seq_len: 200
    output_seq_len: 400 # SR: stesso intervallo (ricostruzione), non futuro
    stride: 2 # slide stride delle finestre

  split:
    seed: 42
    val_ratio: 0.2
    test_ratio: 0.15

sr:
  stride: 2 # osservi un punto ogni 2 (even), mancano gli odd
  offset: 0 # 0 => osservi 0,2,4,...  /  1 => osservi 1,3,5,...
  mask_value: 0.0 # cosa metti nei missing
  loss_on: missing # missing | all
  observed_weight: 0.1 # se loss_on=all, peso sugli observed (stabilità)
    
model:
  name: "sr1"
  save_model: true
  type: "TRN"
  variant: "SR"
  decoder_mode: "ENCODER_ONLY"  # "FULL_SEQ", "STEP_WISE", "HYBRID", "ENCODER_ONLY"

  params:
    dim_model: 64
    num_heads: 4
    ff_dim: 512
    num_layers: 2
    dropout: 0.1

  compile:
    optimizer: "adam"
    loss: "mse"
    metrics: ["mae"]
    run_eagerly: false
    learning_rate: 0.001
    clip_norm: 1.0


training:
  verbose: 1
  epochs: 20
  batch_size: 64
  

plot:
  sample_index: [0,2,4]  # None = 0 , oppure una cosi = 1 oppure lista cosi []
  save_plots: true
  save_artifacts: true